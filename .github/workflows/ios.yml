name: Compilar app iOS

# Compila la app iOS (con el plugin de Salud) en una Mac de GitHub.
# Genera una .ipa SIN FIRMAR: para instalarla en el iPhone hay que firmarla con tu Apple ID
# (por ejemplo con Xcode o Sideloadly). Ver README.

on:
  push:
    branches: [main]
    paths: ['ios/**', 'src/**', 'package.json', 'package-lock.json', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Web para iOS y sincronizar Capacitor
        run: npm run build:ios
      - name: Compilar para simulador (verifica el código Swift)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test ${PIPESTATUS[0]} -eq 0
      - name: Compilar para iPhone sin firmar
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/Entreno.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive | tail -40
          test ${PIPESTATUS[0]} -eq 0
          mkdir -p build/Payload
          cp -R build/Entreno.xcarchive/Products/Applications/App.app build/Payload/
          cp ios/App/App/App.entitlements build/App.entitlements
          (cd build && zip -qr Entreno-sin-firmar.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: Entreno-ios-sin-firmar
          path: |
            build/Entreno-sin-firmar.ipa
            build/App.entitlements
